[package]
name = "armada-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal client (Ratatui) inspirado no Armada da Soapbox — comunidades E2EE Concord + grupos NIP-29"
license = "AGPL-3.0-or-later"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
base64 = "0.22"
ureq = "2"
